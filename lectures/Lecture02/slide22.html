<title>Debate</title>

<div class="frame">
<div class="dbw"><div>
  <p class="dbq">Ternary search discards <b>two thirds</b> of the range each step. Binary search discards only half. Is ternary search <b>faster</b>?</p>
  <div class="dbs"><div class="y"><b>Yes, because…</b>It needs fewer steps to shrink the range.</div><div class="n"><b>No, because…</b>Each step has to check two points, not one.</div></div>
