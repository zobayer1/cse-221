<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Can you spot a problem?</title>
<link rel="stylesheet" href="../theme/theme.css"><style>
.arr { display:flex; }
.arr .c { display:flex; flex-direction:column; align-items:center; }
.arr .v { width:var(--w,92px); height:var(--h,78px); border:2px solid var(--ink); margin-left:-2px; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-weight:700; font-size:var(--fs,34px); background:#fff; }

.arr .v.hit { box-shadow:inset 0 0 0 3px #C62828; }

.tagq { display:inline-block; font-size:15px; font-weight:700; color:#fff; background:var(--blue); padding:4px 12px; letter-spacing:0.06em; text-transform:uppercase; }
.eg { margin-top:36px; display:grid; grid-template-columns:repeat(3,1fr); gap:36px; }
.ec { border:2px solid var(--ink); border-radius:10px; padding:16px 18px 18px; display:flex; flex-direction:column; align-items:center; }
.ec h3 { font-family:var(--serif); font-weight:700; font-size:28px; margin-top:4px; }
.ec svg { margin:6px 0 10px; }
.ec .q { width:100%; display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--grey); padding:10px 4px; font-size:21px; }
.ec .q i { font-style:normal; width:38px; height:38px; border:2.5px dashed var(--blue); border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-weight:700; font-size:24px; color:var(--blue); }

.sp { flex:1; display:grid; grid-template-columns:1fr 320px; gap:30px; align-items:center; }
.spq { display:flex; flex-direction:column; gap:22px; }
.spq .it { display:flex; gap:14px; align-items:flex-start; }
.spq .it b.n { font-family:var(--serif); color:var(--blue); font-size:30px; line-height:1; }
.spq .it p { font-size:22px; line-height:1.4; }
.spq .arr { --w:54px; --h:48px; --fs:24px; margin-top:10px; }
.spq .arr .v.pv { background:var(--ink); color:#fff; border-color:var(--ink); position:relative; z-index:1; }
.big2 { font-family:var(--serif); font-size:34px; font-weight:700; margin-bottom:4px; }
</style></head>
