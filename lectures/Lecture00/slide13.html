<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assessment</title>
<link rel="stylesheet" href="../theme/theme.css"><style>
.stack { margin-top:40px; display:flex; height:190px; border:1.5px solid var(--ink); }
.seg { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:0 14px; color:#fff; text-align:center; }
.seg + .seg { border-left:2px solid #fff; }
.seg.light { color:var(--ink); }
.seg .pct { font-family:var(--serif); font-size:48px; line-height:1; }
.seg .name { font-size:21px; line-height:1.2; }
.seg.min { flex:0 0 auto; }
.nomk { margin-top:28px; align-self:flex-start; } /* 5%: only as wide as its label needs */
</style></head>
<body><div class="slide">
<div class="frametitle">Assessment</div>
<div class="frame">
<p class="lede">How your final grade of 100% is made up</p>
<div class="stack"><div class="seg light min" style="background:#A7A9AC"><span class="pct">5%</span><span class="name">Assignment</span></div><div class="seg light" style="flex:20 1 0;background:#8AA8DA"><span class="pct">20%</span><span class="name">Quiz</span></div><div class="seg" style="flex:20 1 0;background:#2B5BAA"><span class="pct">20%</span><span class="name">Midterm exam</span></div><div class="seg" style="flex:25 1 0;background:#1A3B73"><span class="pct">25%</span><span class="name">Lab</span></div><div class="seg" style="flex:30 1 0;background:#000"><span class="pct">30%</span><span class="name">Final exam</span></div></div>
<div class="block alert nomk"><div class="bb"><b>No makeup quiz.</b><br><b>Quiz:</b> best 4 out of 6. &ensp;<b>Assignment:</b> average of 2.</div></div>
</div>
</div><script src="deck.js"></script><script src="../theme/theme.js"></script></body></html>
