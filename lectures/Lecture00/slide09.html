<title>Prerequisites</title>
<link rel="stylesheet" href="../theme/theme.css"><style>
.path { margin-top:56px; display:grid; grid-template-columns:1fr 48px 1fr 48px 1fr 48px 1fr; align-items:stretch; }
.course { border:1.5px solid var(--ink); border-radius:6px; padding:20px 22px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.18); }
.course .c { font-size:20px; font-weight:700; color:var(--blue); }
.course .t { font-size:26px; line-height:1.2; margin-top:8px; min-height:62px; }
.course .cr { font-size:18px; color:var(--muted); margin-top:10px; }
.course.this { position:relative; background:var(--blue); border-color:var(--blue); color:#fff; }
.course.this .c, .course.this .cr { color:#dce6f5; }
.course.this .here { position:absolute; right:6px; bottom:100%; } /* overlay standing on the box */
.arrow { display:flex; align-items:center; justify-content:center; }
.arrow::before { content:''; width:22px; height:2px; background:var(--ink); }
.arrow::after { content:''; border-left:10px solid var(--ink); border-top:7px solid transparent; border-bottom:7px solid transparent; }
</style></head>
