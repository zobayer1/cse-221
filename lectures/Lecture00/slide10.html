<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credits and contact hours</title>
<link rel="stylesheet" href="../theme/theme.css"><style>
.facts { display:grid; grid-template-columns:repeat(4,1fr); border-top:2px solid var(--ink); border-bottom:2px solid var(--ink); }
.fact { padding:22px 12px 26px; text-align:center; }
.fact .k { font-size:20px; color:var(--muted); }
.fact .v { font-family:var(--serif); font-size:60px; line-height:1.1; margin-top:12px; display:flex; gap:18px; align-items:flex-start; justify-content:center; }
.split { display:flex; flex-direction:column; align-items:center; }
.split small { font-family:var(--sans); font-size:17px; color:var(--muted); }
.plus { color:var(--grey); }
</style></head>
<body><div class="slide">
<div class="frametitle">Credits and contact hours</div>
<div class="frame">
<div class="facts">
  <div class="fact"><div class="k">Credit hours</div><div class="v"><span class="split">3<small>Theory</small></span><span class="plus">+</span><span class="split">0<small>Lab</small></span></div></div>
  <div class="fact"><div class="k">Contact hours per week</div><div class="v"><span class="split">3<small>Theory</small></span><span class="plus">+</span><span class="split">3<small>Lab</small></span></div></div>
  <div class="fact"><div class="k">Course type</div><div class="v">Core</div></div>
  <div class="fact"><div class="k">Co-requisite</div><div class="v">None</div></div>
</div>
<div class="block push"><div class="bt">About the lab</div><div class="bb">It carries no separate credit hours, but the 3-hour weekly session is compulsory and counts for <b>25%</b> of your grade.</div></div>
</div>
</div><script src="deck.js"></script><script src="../theme/theme.js"></script></body></html>
