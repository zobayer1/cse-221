<div class="frametitle">Why “selection” sort?</div>
<div class="frame"><div class="nmw"><div><p class="nm-q">Think of <b>lining people up by height</b>.</p><div class="map"><div class="r"><span class="h">In real life</span><span></span><span class="h">In the algorithm</span></div><div class="r"><span>Look at everyone not yet in line</span><span class="ar">→</span><span>Scan the <b>unsorted part</b> A[i..n − 1]</span></div><div class="r"><span>Select the shortest person</span><span class="ar">→</span><span>Find the <b>minimum</b></span></div><div class="r"><span>Send them to the next spot in line</span><span class="ar">→</span><span><b>Swap</b> it into position i: final, never moves again</span></div></div></div><div><svg viewBox="0 0 560 470" width="560" height="470" font-family="CMU Sans Serif, KaTeX_Main, KaTeX_Size1" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 402 H540" stroke="#1a1a1a" stroke-width="2"/><rect x="20" y="404" width="130" height="10" fill="#2B5BAA"/><text x="85" y="436" font-size="14" fill="#2B5BAA" text-anchor="middle" font-weight="600">front of the line</text><g stroke="#2B5BAA" stroke-width="2.4"><circle cx="50" cy="296" r="13"/><path d="M45 293 q2 -3 4 0 M51 293 q2 -3 4 0 M45 300 q5 5 10 0"/><path d="M50 309 L50 359.05 M50 359.05 L40 400 M50 359.05 L60 400 M50 324 L36 350 M50 324 L64 350"/></g><g stroke="#2B5BAA" stroke-width="2.4"><circle cx="110" cy="278" r="13"/><path d="M105 275 q2 -3 4 0 M111 275 q2 -3 4 0 M105 282 q5 5 10 0"/><path d="M110 291 L110 350.95 M110 350.95 L100 400 M110 350.95 L120 400 M110 306 L96 332 M110 306 L124 332"/></g><g stroke="#1a1a1a" stroke-width="2.4"><circle cx="200" cy="226" r="13"/><path d="M195 224 h3 M202 224 h3 M196 232 h8"/><path d="M200 239 L200 327.55 M200 327.55 L190 400 M200 327.55 L210 400 M200 254 L186 280 M200 254 L214 280"/></g><g stroke="#1a1a1a" stroke-width="2.4"><circle cx="260" cy="256" r="13"/><path d="M255 254 h3 M262 254 h3 M256 262 h8"/><path d="M260 269 L260 341.05 M260 341.05 L250 400 M260 341.05 L270 400 M260 28
