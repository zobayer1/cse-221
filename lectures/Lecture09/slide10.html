<body><div class="slide">
<div class="frametitle">Weighted and unweighted graphs</div>
<div class="frame">
<div class="c2"><div>
<h3>Unweighted</h3><svg data-figure viewBox="0 0 490 325" width="420" height="278.6" font-family="CMU Sans Serif, KaTeX_Main, KaTeX_Size1"><line x1="84.6" y1="79.5" x2="191.4" y2="58.5" stroke="#000" stroke-width="2.4"/><line x1="68.2" y1="106.2" x2="105.8" y2="241.8" stroke="#000" stroke-width="2.4"/><line x1="204" y1="74.7" x2="122" y2="243.3" stroke="#000" stroke-width="2.4"/><line x1="233.4" y1="66.4" x2="328.6" y2="127.6" stroke="#000" stroke-width="2.4"/><line x1="359.8" y1="159.7" x2="416.2" y2="254.3" stroke="#000" stroke-width="2.4"/><circle cx="62" cy="84" r="23" fill="#fff" stroke="#000" stroke-width="2.2"/><text x="62" y="92.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">A</text><circle cx="214" cy="54" r="23" fill="#fff" stroke="#000" stroke-width="2.2"/><text x="214" y="62.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">B</text><circle cx="112" cy="264" r="23" fill="#fff" stroke="#000" stroke-width="2.2"/><text x="112" y="272.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">C</text><circle cx="348" cy="140" r="23" fill="#fff" stroke="#000" stroke-width="2.2"/><text x="348" y="148.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">D</text><circle cx="428" cy="274" r="23" fill="#fff" stroke="#000" stroke-width="2.2"/><text x="428" y="282.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">E</text><circle cx="262" cy="272" r="23" fill="#fff" stroke="#000" stroke-width="2.2"/><text x="262" y="280.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">F</text></svg>
<p>An edge only says that two vertices are <b>linked</b>.</p>
<p class="ex">Every edge counts the same.</p>
</div><div>

rect x="74.2" y="158" width="25.7" height="32" fill="#fff"/><text x="87" y="183.2" text-anchor="middle" font-size="27" fill="#2B5BAA" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1" font-weight="700">7</text><rect x="150.2" y="143" width="25.7" height="32" fill="#fff"/><text x="163" y="168.2" text-anchor="middle" font-size="27" fill="#2B5BAA" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1" font-weight="700">2</text><rect x="268.2" y="81" width="25.7" height="32" fill="#fff"/><text x="281" y="106.2" text-anchor="middle" font-size="27" fill="#2B5BAA" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1" font-weight="700">5</text><rect x="375.2" y="191" width="25.7" height="32" fill="#fff"/><text x="388" y="216.2" text-anchor="middle" font-size="27" fill="#2B5BAA" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1" font-weight="700">3</text></svg>
<p>Each edge has a number, its <b>weight</b> <var>w</var>(<var>u</var>, <var>v</var>).</p>
<p class="ex">A weight can be a distance, a time or a cost.</p>
</div></div>
