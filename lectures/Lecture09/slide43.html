<div class="frametitle">Is the graph connected?</div>
<div class="frame">
<div class="block"><div class="bb"><var>BFS</var>(<var>G</var>, <var>s</var>) discovers exactly the vertices reachable from <var>s</var>. So an undirected graph is <b>connected</b> if and only if <b>no vertex is left white</b>.</div></div>

MU Serif, KaTeX_Main, KaTeX_Size1"><tspan font-style="italic">D</tspan></text><circle cx="428" cy="274" r="23" fill="#000" stroke="#000" stroke-width="2.2"/><text x="428" y="282.5" text-anchor="middle" font-size="25" fill="#fff" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">3</text><text x="462" y="304" text-anchor="middle" font-size="27" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1"><tspan font-style="italic">E</tspan></text><circle cx="262" cy="272" r="23" fill="#000" stroke="#000" stroke-width="2.2"/><text x="262" y="280.5" text-anchor="middle" font-size="25" fill="#fff" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">2</text><text x="262" y="318" text-anchor="middle" font-size="27" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1"><tspan font-style="italic">F</tspan></text></svg><p class="ex ok"><svg class="tick" viewBox="0 0 16 16"><path d="M3 8.5l3.3 3.3L13 4.6"/></svg> BFS from <var>A</var>: no white vertex</p></div><div><h3>Disconnected</h3><svg data-figure viewBox="0 0 490 325" width="420" height="278.6" font-family="CMU Sans Serif, KaTeX_Main, KaTeX_Size1"><line x1="62" y1="84" x2="214" y2="54" stroke="#000" stroke-width="2.4"/><line x1="62" y1="84" x2="112" y2="264" stroke="#000" stroke-width="2.4"/><line x1="214" y1="54" x2="112" y2="264" stroke="#000" stroke-width="2.4"/><line x1="348" y1="140" x2="428" y2="274" stroke="#000" stroke-width="2.4"/><circle cx="62" cy="84" r="23" fill="#000" stroke="#000" stroke-width="2.2"/><text x="62" y="92.5" text-anchor="middle" font-size="25" fill="#fff" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">0</text><text x="28" y="62" text-anchor="middle" font-size="27" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1"><tspan font-style="italic">A</tspan></text><circle cx="214" cy="54" r="23" fill="#000" stroke="#000" stroke-width="2.2"/><text x="214" y="62.5" text-anchor="middle" font-size="25" fill="#fff" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">1</text><text x="214" y="18
