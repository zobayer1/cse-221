<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paths and cycles</title>
<link rel="stylesheet" href="../theme/theme.css"><style>
.c2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:56px; text-align:center; }
.c2 h3 { font-weight:700; font-size:28px; margin-bottom:6px; }
.c2 p { font-size:23px; line-height:1.4; margin-top:8px; }

</style></head>
<body><div class="slide">
<div class="frametitle">Paths and cycles</div>
<div class="frame">
<div class="c2"><div>
<h3>Path</h3><svg data-figure viewBox="0 0 490 325" width="390" height="258.7" font-family="CMU Sans Serif, KaTeX_Main, KaTeX_Size1"><line x1="84.6" y1="79.5" x2="191.4" y2="58.5" stroke="#2B5BAA" stroke-width="4.2"/><line x1="68.2" y1="106.2" x2="105.8" y2="241.8" stroke="#000" stroke-width="2.4"/><line x1="204" y1="74.7" x2="122" y2="243.3" stroke="#000" stroke-width="2.4"/><line x1="233.4" y1="66.4" x2="328.6" y2="127.6" stroke="#2B5BAA" stroke-width="4.2"/><line x1="359.8" y1="159.7" x2="416.2" y2="254.3" stroke="#2B5BAA" stroke-width="4.2"/><circle cx="62" cy="84" r="23" fill="#E9EEF7" stroke="#2B5BAA" stroke-width="2.2"/><text x="62" y="92.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">A</text><circle cx="214" cy="54" r="23" fill="#E9EEF7" stroke="#2B5BAA" stroke-width="2.2"/><text x="214" y="62.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">B</text><circle cx="112" cy="264" r="23" fill="#fff" stroke="#000" stroke-width="2.2"/><text x="112" y="272.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">C</text><circle cx="348" cy="140" r="23" fill="#E9EEF7" stroke="#2B5BAA" stroke-width="2.2"/><text x="348" y="148.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">D</text><circle cx="428" cy="274" r="23" fill="#E9EEF7" stroke="#2B5BAA" stroke-width="2.2"/><text x="428" y="282.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">E</text><circle cx="262" cy="272" r="23" fill="#fff" stroke="#000" stroke-width="2.2"/><text x="262" y="280.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">F</text></svg>
<p>A sequence of vertices,<br>each adjacent to the next.</p>
<p><span class="rm">⟨A, B, D, E⟩</span> has <b>length</b> 3: it uses 3 edges.</p>
<p class="ex"><b>Simple</b> path: no vertex repeats.</p>
</div><div>
<h3>Cycle</h3><svg data-figure viewBox="0 0 490 325" width="390" height="258.7" font-family="CMU Sans Serif, KaTeX_Main, KaTeX_Size1"><line x1="84.6" y1="79.5" x2="191.4" y2="58.5" stroke="#2B5BAA" stroke-width="4.2"/><line x1="68.2" y1="106.2" x2="105.8" y2="241.8" stroke="#2B5BAA" stroke-width="4.2"/><line x1="204" y1="74.7" x2="122" y2="243.3" stroke="#2B5BAA" stroke-width="4.2"/><line x1="233.4" y1="66.4" x2="328.6" y2="127.6" stroke="#000" stroke-width="2.4"/><line x1="359.8" y1="159.7" x2="416.2" y2="254.3" stroke="#000" stroke-width="2.4"/><circle cx="62" cy="84" r="23" fill="#E9EEF7" stroke="#2B5BAA" stroke-width="2.2"/><text x="62" y="92.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">A</text><circle cx="214" cy="54" r="23" fill="#E9EEF7" stroke="#2B5BAA" stroke-width="2.2"/><text x="214" y="62.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">B</text><circle cx="112" cy="264" r="23" fill="#E9EEF7" stroke="#2B5BAA" stroke-width="2.2"/><text x="112" y="272.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">C</text><circle cx="348" cy="140" r="23" fill="#fff" stroke="#000" stroke-width="2.2"/><text x="348" y="148.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">D</text><circle cx="428" cy="274" r="23" fill="#fff" stroke="#000" stroke-width="2.2"/><text x="428" y="282.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">E</text><circle cx="262" cy="272" r="23" fill="#fff" stroke="#000" stroke-width="2.2"/><text x="262" y="280.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">F</text></svg>
<p>A path of length ≥ 3 that ends where it starts,<br>repeating no other vertex.</p>
<p><span class="rm">⟨A, B, C, A⟩</span> has length 3.</p>
<p class="ex">A graph with no cycles is <b>acyclic</b>.</p>
</div></div>
</div>
