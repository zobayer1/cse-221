<div class="frame">
<div class="rw"><div>
<div class="block"><div class="bt">Definition</div><div class="bb">A <b>graph</b> <var>G</var> = (<var>V</var>, <var>E</var>) is a pair of sets:
<ul class="items"><li><var>V</var>: a finite set of <b>vertices</b></li><li><var>E</var>: a set of <b>edges</b>, each joining two vertices</li></ul></div></div>
<div class="sets"><div><var>V</var> = {A, B, C, D, E, F}<span class="sz">|<var>V</var>| = 6</span></div><div><var>E</var> = {(A, B), (A, C), (B, C), (B, D), (D, E)}<span class="sz">|<var>E</var>| = 5</span></div></div>

<p class="nt"><b>The two sets define the graph.</b> A drawing is one way to picture them.</p>
