<div class="frametitle">The handshaking lemma: directed graphs</div>
<div class="frame">
<div class="block"><div class="bt">For a directed graph with <var>m</var> = |<var>E</var>| edges</div><div class="bb"><div class="fm">∑<sub><var>v</var>∈<var>V</var></sub> indeg(<var>v</var>) = ∑<sub><var>v</var>∈<var>V</var></sub> outdeg(<var>v</var>) = <var>m</var></div></div></div>
<div class="why"><svg data-figure viewBox="0 0 360 92" width="360" height="92" font-family="CMU Sans Serif, KaTeX_Main, KaTeX_Size1"><line x1="83" y1="62" x2="265" y2="62" stroke="#000" stroke-width="3.6"/><polygon points="277,62 262,69 262,55" fill="#000"/><circle cx="60" cy="62" r="23" fill="#fff" stroke="#000" stroke-width="2.2"/><text x="60" y="70.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1"><tspan font-style="italic">u</tspan></text><circle cx="300" cy="62" r="23" fill="#fff" stroke="#000" stroke-width="2.2"/><text x="300" y="70.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1"><tspan font-style="italic">v</tspan></text><text x="60" y="22" text-anchor="middle" font-size="22" fill="#2B5BAA" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1" font-weight="700">+1 outdeg</text><text x="300" y="22" text-anchor="middle" font-size="22" fill="#B86E00" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1" font-weight="700">+1 indeg</text></svg><p>Every edge <b>leaves one</b> vertex and <b>enters one</b>. It adds 1 to each sum.</p></div>
<div class="chk"><svg data-figure viewBox="0 0 490 325" width="330" height="218.9" font-family="CMU Sans Serif, KaTeX_Main, KaTeX_Size1"><line x1="84.6" y1="79.5" x2="179.7" y2="60.8" stroke="#000" stroke-width="2.4"/><polygon points="191.4,58.5 178.1,68.2 175.4,54.5" fill="#000"/><line x1="105.8" y1="241.8" x2="71.4" y2="117.7" stroke="#000" stroke-width="2.4"/><polygon points="68.2,106.2 78.9,118.7 65.4,122.5" fill="#000"/><line x1="204" y1="74.7" x2="127.3" y2="232.5" stroke="#000" stroke-width="2.4"/><polygon points="122,243.3 122.3,226.8 134.9,232.9" fill="#000"/><line x1="233.4" y1="66.4" x2="318.5" y2="121.1" stroke="#000" stroke-width="2.4"/><polygon points="328.6,127.6 312.2,125.4 319.8,113.6" fill="#000"/><line x1="416.2" y1="254.3" x2="365.9" y2="170.1" stroke="#000" stroke-width="2.4"/><polygon points="359.8,159.7 373.5,169 361.5,176.2" fill="#000"/><circle cx="62" cy="84" r="23" fill="#fff" stroke="#000" stroke-width="2.2"/><text x="62" y="92.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">A</text><circle cx="214" cy="54" r="23" fill="#fff" stroke="#000" stroke-width="2.2"/><text x="214" y="62.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">B</text><circle cx="112" cy="264" r="23" fill="#fff" stroke="#000" stroke-width="2.2"/><text x="112" y="272.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">C</text><circle cx="348" cy="140" r="23" fill="#fff" stroke="#000" stroke-width="2.2"/><text x="348" y="148.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">D</text><circle cx="428" cy="274" r="23" fill="#fff" stroke="#000" stroke-width="2.2"/><text x="428" y="282.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">E</text><circle cx="262" cy="272" r="23" fill="#fff" stroke="#000" stroke-width="2.2"/><text x="262" y="280.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">F</text></svg><div>
<div class="cap">Our directed graph, vertices <span class="rm">A</span> to <span class="rm">F</span> in order:</div>
<div class="tot"><span class="i">indeg</span><span>1 + 1 + 1 + 2 + 0 + 0 = 5</span><span class="o">outdeg</span><span>1 + 2 + 1 + 0 + 1 + 0 = 5</span><span><var>m</var></span><span>5</span></div>
</div></div>
