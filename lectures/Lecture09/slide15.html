<div class="frametitle">The handshaking lemma</div>
<div class="frame">
<div class="block"><div class="bt">For an undirected graph</div><div class="bb"><div class="fm">∑<sub><var>v</var>∈<var>V</var></sub> deg(<var>v</var>) = 2|<var>E</var>|</div></div></div>
<div class="why"><svg data-figure viewBox="0 0 360 92" width="360" height="92" font-family="CMU Sans Serif, KaTeX_Main, KaTeX_Size1"><line x1="83" y1="62" x2="277" y2="62" stroke="#2B5BAA" stroke-width="3.6"/><circle cx="60" cy="62" r="23" fill="#fff" stroke="#000" stroke-width="2.2"/><text x="60" y="70.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1"><tspan font-style="italic">u</tspan></text><circle cx="300" cy="62" r="23" fill="#fff" stroke="#000" stroke-width="2.2"/><text x="300" y="70.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1"><tspan font-style="italic">v</tspan></text><text x="60" y="20" text-anchor="middle" font-size="25" fill="#2B5BAA" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1" font-weight="700">+1</text><text x="300" y="20" text-anchor="middle" font-size="25" fill="#2B5BAA" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1" font-weight="700">+1</text></svg><p>Every edge has <b>two endpoints</b>. It adds 1 to each one’s degree, so 2 to the total.</p></div>
<p class="ot"><b>Adjacency lists</b> store each undirected edge twice, so the lists hold 2|<var>E</var>| entries in total.</p>
