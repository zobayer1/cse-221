<div class="block"><div class="bt">Definition</div><div class="bb">The <b>degree</b> of <var>v</var>, written deg(<var>v</var>), is the number of edges incident on <var>v</var>.</div></div>
<ul class="items">
<li>deg(<span class="nm">B</span>) = 3: edges to <span class="nm">A</span>, <span class="nm">C</span> and <span class="nm">D</span>.</li>
<li>In a simple graph, degree = number of neighbors.</li>
<li>deg(<span class="nm">F</span>) = 0: <span class="nm">F</span> is <b>isolated</b>.</li>
</ul></div></div>
