<div class="frametitle">Connectivity</div>
<div class="frame">
<div class="block"><div class="bt">Definition</div><div class="bb defs"><p><var>v</var> is <b>reachable</b> from <var>u</var> if there is a path from <var>u</var> to <var>v</var>.</p>
<p>An undirected graph is <b>connected</b> if every vertex is reachable from every other vertex.</p>
<p>In a directed graph, this property is called <b>strongly connected</b>.</p></div></div>
