<p>Edges have no direction.<br>(<var>u</var>, <var>v</var>) and (<var>v</var>, <var>u</var>) are the <b>same</b> edge.</p>
<p class="ex">A friendship goes both ways.</p>
</div><div>

text x="262" y="280.5" text-anchor="middle" font-size="25" fill="#000" font-family="CMU Serif, KaTeX_Main, KaTeX_Size1">F</text></svg>
<p>Edge (<var>u</var>, <var>v</var>) points from <var>u</var> to <var>v</var>.<br>(<var>u</var>, <var>v</var>) and (<var>v</var>, <var>u</var>) are <b>different</b> edges.</p>
<p class="ex">Following an account goes one way.</p>
