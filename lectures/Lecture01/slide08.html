<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Example: finding the minimum (2)</title>
<link rel="stylesheet" href="../theme/theme.css"><style>
.code { font-family:var(--mono); }
.kw { font-weight:700; color:var(--blue); }
.ln { color:var(--grey); display:inline-block; width:2.2em; user-select:none; }

.mw { margin-top:24px; display:grid; grid-template-columns:1.45fr 1fr; gap:44px; flex:1; min-height:0; }
.k3 { font-size:15px; font-weight:700; color:var(--blue); letter-spacing:0.08em; text-transform:uppercase; padding-bottom:8px; border-bottom:2px solid var(--ink); }
table.mc { width:100%; border-collapse:collapse; }
table.mc th { font-size:15px; font-weight:400; color:var(--muted); text-align:right; padding:8px 0 6px; border-bottom:1px solid var(--grey); }
table.mc th:first-child { text-align:left; }
table.mc th.hd { font-family:var(--mono); font-weight:700; font-size:19px; color:var(--ink); }
table.mc td { padding:7px 0; border-bottom:1px solid var(--grey); vertical-align:baseline; }
table.mc td.c { font-family:var(--mono); font-size:20px; white-space:pre; }
table.mc td.r { text-align:right; font-family:var(--serif); font-weight:700; font-size:24px; color:var(--blue); white-space:nowrap; }
table.mc td.r .q2 { font-family:var(--sans); font-weight:700; font-size:17px; color:#C62828; margin-right:10px; font-style:normal; }
table.mc td.r small { display:block; font-family:var(--sans); font-weight:400; font-size:13px; color:var(--muted); }
.res { margin-top:16px; background:var(--blue); color:#fff; padding:14px 22px; font-family:var(--serif); font-size:26px; }
.res span { color:#dce6f5; }
.res b { font-weight:700; }
.wc { margin-top:10px; font-size:16px; color:var(--muted); line-height:1.45; }
table.sc { width:100%; border-collapse:collapse; }
table.sc td { padding:8px 0; border-bottom:1px solid var(--grey); font-size:19px; }
table.sc td:nth-child(2) { color:var(--muted); font-size:16px; }
table.sc td.r { text-align:right; font-family:var(--serif); font-weight:700; font-size:24px; }
.res2 { margin-top:16px; background:var(--tint); border-left:5px solid var(--blue); padding:12px 20px; font-family:var(--serif); font-size:23px; line-height:1.5; }
.res2 b { color:var(--blue); }
.mw { grid-template-columns:1fr !important; width:760px; margin:0 auto; zoom:1.3; }
</style></head>
<body><div class="slide">
<div class="frametitle">Example: finding the minimum (2)</div>
<div class="frame">

<div class="mw">
  <div>
    <div class="k3">Space: count the memory cells</div>
    <table class="sc">
      <tr><td class="code">A[0..n − 1]</td><td>input</td><td class="r"><i>n</i></td></tr>
      <tr><td class="code">m</td><td>extra</td><td class="r">1</td></tr>
      <tr><td class="code">i</td><td>extra</td><td class="r">1</td></tr>
    </table>
    <div class="res2"><i>S</i>(<i>n</i>) = <i>n</i> + 2<br>Extra space = <b>2</b>, whatever <i>n</i> is</div>
  </div>
</div>
</div>
