<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>References</title>
<link rel="stylesheet" href="../theme/theme.css"><style>
.ref { display:grid; grid-template-columns:220px 1fr; gap:56px; align-items:center; }
.cover { box-shadow:0 3px 12px rgba(0,0,0,.3); border-radius:3px; overflow:hidden; }
.cover img { display:block; width:100%; }
.bib { font-size:22px; color:var(--muted); margin-bottom:22px; }
.bib b { color:var(--ink); }
.block .bb { padding:6px 22px 10px; }
.sec { display:grid; grid-template-columns:1fr auto; gap:24px; padding:12px 0; border-bottom:1px solid var(--rule); align-items:baseline; }
.sec:last-child { border-bottom:none; }
.sec span { color:var(--muted); font-size:20px; white-space:nowrap; }
</style></head>
<body><div class="slide">
<div class="frametitle">References</div>
<div class="frame">
<div class="ref">
  <div class="cover"><img src="thumbs/clrs.jpg" alt="Cover of Introduction to Algorithms"></div>
  <div>
    <p class="bib"><b>Introduction to Algorithms</b> (CLRS), 3rd edition<br>Cormen, Leiserson, Rivest and Stein</p>
    <div class="block"><div class="bt">Read before next class</div><div class="bb">
      <div class="sec"><div>§2.2 Analyzing algorithms <span class="muted small">the RAM model</span></div><span>p. 23</span></div>
      <div class="sec"><div>Ch. 3 Growth of Functions</div><span>p. 43</span></div>
      <div class="sec"><div>§3.2 Standard notations and common functions</div><span>p. 53</span></div>
    </div></div>
  </div>
</div>
</div>
</div><script src="deck.js"></script><script src="../theme/theme.js"></script></body></html>
