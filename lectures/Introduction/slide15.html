<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class and consultation hours</title>
<link rel="stylesheet" href="../theme/theme.css"><style>
.days { font-size:34px; }
.days span { color:var(--grey); margin:0 8px; }
.tl { position:relative; margin-top:36px; height:240px; }
.axis { position:absolute; left:0; right:0; top:184px; height:2px; background:var(--ink); }
.tick { position:absolute; top:176px; transform:translateX(-50%); text-align:center; }
.tick i { display:block; width:2px; height:18px; background:var(--ink); margin:0 auto; }
.tick b { display:block; font-size:18px; font-weight:400; color:var(--muted); margin-top:8px; white-space:nowrap; }
.blk { position:absolute; top:0; height:170px; padding:20px 24px; border-radius:6px 6px 0 0; }
.blk h3 { font-size:28px; font-weight:700; }
.blk p { font-size:21px; margin-top:8px; line-height:1.4; }
.blk.cls { background:var(--blue); color:#fff; }
.blk.cls p { color:#dce6f5; }
.blk.con { background:var(--tint); border:1.5px solid var(--blue); border-bottom:none; }
.blk.con p { color:var(--muted); }
</style></head>
<body><div class="slide">
<div class="frametitle">Class and consultation hours</div>
<div class="frame">
<div class="days">Saturday <span>and</span> Thursday</div>
<div class="tl"><div class="axis"></div><div class="tick" style="left:4.35%"><i></i><b>11 AM</b></div><div class="tick" style="left:30.43%"><i></i><b>12 PM</b></div><div class="tick" style="left:56.52%"><i></i><b>1 PM</b></div><div class="tick" style="left:82.61%"><i></i><b>2 PM</b></div>
  <div class="blk cls" style="left:4.35%;width:34.78%"><h3>Class</h3><p>11:00 AM – 12:20 PM<br>Room 10A-05C</p></div>
  <div class="blk con" style="left:43.48%;width:52.17%"><h3>Consultation</h3><p>12:30 PM – 2:30 PM<br>Desk 4G29</p></div>
</div>
<p class="push">Come to consultation with questions on lectures, assignments or anything else in the course.</p>
</div>
</div><script src="deck.js"></script><script src="../theme/theme.js"></script></body></html>
