<div class="frametitle">In Knuth’s words</div>
<div class="frame">
<figure class="q">
  <blockquote>Besides merely being a finite set of rules that gives a sequence of operations for solving a specific type of problem, an algorithm has five important features:
    <span class="feat"><span>1) Finiteness …</span> <span>2) Definiteness …</span> <span>3) Input …</span> <span>4) Output …</span> <span>5) Effectiveness …</span></span></blockquote>
  <figcaption>Donald E. Knuth, <i>The Art of Computer Programming</i>, Vol. 1, §1.1 (1968)</figcaption>
</figure>
