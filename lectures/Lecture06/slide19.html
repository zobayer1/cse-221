<div class="st"><b>Green</b> is <span class="m g"><i>c</i> · <i>g</i>(<i>n</i>)</span>, now a floor instead of a ceiling.</div>
<div class="st"><b>Left of <i>n</i><sub>0</sub></b>, anything goes: <i>f</i>(<i>n</i>) may even dip below the green curve.</div>
<div class="st"><b>From <i>n</i><sub>0</sub> on</b>, <i>f</i>(<i>n</i>) stays on or above the green curve, forever.</div>
<p class="cn">So <b><i>f</i>(<i>n</i>) = Ω(<i>g</i>(<i>n</i>))</b>.</p>
<p class="src">The same idea as CLRS Figure 3.1(c), p. 45.</p>
