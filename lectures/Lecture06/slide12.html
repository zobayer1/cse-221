<div class="st"><b>Red</b> is <span class="m r"><i>c</i> · <i>g</i>(<i>n</i>)</span>: the simple function <i>g</i>, stretched by <i>c</i>.</div>
<div class="st"><b>Left of <i>n</i><sub>0</sub></b>, anything goes: <i>f</i>(<i>n</i>) may even climb above the red curve.</div>
<div class="st"><b>From <i>n</i><sub>0</sub> on</b>, <i>f</i>(<i>n</i>) stays on or below the red curve, forever.</div>
<p class="cn">So <b><i>f</i>(<i>n</i>) = O(<i>g</i>(<i>n</i>))</b>.</p>
<p class="src">The same idea as CLRS Figure 3.1(b), p. 45.</p>
